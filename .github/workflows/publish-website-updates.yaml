name: Publish Maven Updates to Website

on:
  pull_request:
    paths:
      - 'src/docs/reports/**/index.md'
      - 'scripts/publish_website_updates.py'
      - 'scripts/category_titles_de.yaml'
  workflow_dispatch:
    inputs:
      months:
        description: 'Comma-separated months to publish (e.g. 2026/05,2026/06). Leave empty to use reports changed on the PR, or all structured reports under src/docs/reports.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Create website updates PR
    runs-on: ubuntu-latest
    steps:
      - name: Check out maven-support-and-care
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve candidate report files
        id: candidates
        env:
          INPUT_MONTHS: ${{ inputs.months }}
        run: |
          set -euo pipefail

          resolve_from_months() {
            local months="$1"
            local paths=()
            IFS=',' read -ra parts <<< "$months"
            for part in "${parts[@]}"; do
              part="$(echo "$part" | xargs)"
              [[ -z "$part" ]] && continue
              local path="src/docs/reports/${part}/index.md"
              if [[ ! -f "$path" ]]; then
                echo "Report not found: $path" >&2
                exit 1
              fi
              paths+=("$path")
            done
            printf '%s\n' "${paths[@]}"
          }

          CANDIDATES=()

          if [[ -n "${INPUT_MONTHS:-}" ]]; then
            while IFS= read -r path; do
              [[ -n "$path" ]] && CANDIDATES+=("$path")
            done < <(resolve_from_months "$INPUT_MONTHS")
            echo "strict=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            mapfile -t CANDIDATES < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- 'src/docs/reports/**/index.md' || true)
            TMP=()
            for path in "${CANDIDATES[@]:-}"; do
              [[ -f "$path" ]] && TMP+=("$path")
            done
            CANDIDATES=("${TMP[@]:-}")
            echo "strict=false" >> "$GITHUB_OUTPUT"
          else
            mapfile -t CANDIDATES < <(git ls-files 'src/docs/reports/**/index.md')
            echo "strict=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ ${#CANDIDATES[@]} -eq 0 ]]; then
            echo "No candidate monthly reports."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "found=true"
            echo "files<<EOF"
            printf '%s\n' "${CANDIDATES[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Candidate reports:"
          printf '  - %s\n' "${CANDIDATES[@]}"

      - name: Set up Python
        if: steps.candidates.outputs.found == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install script dependencies
        if: steps.candidates.outputs.found == 'true'
        run: pip install -r scripts/requirements.txt

      - name: Validate reports with real parser
        if: steps.candidates.outputs.found == 'true'
        id: reports
        env:
          STRICT: ${{ steps.candidates.outputs.strict }}
        run: |
          set -euo pipefail

          CANDIDATES=()
          while IFS= read -r path; do
            [[ -n "$path" ]] && CANDIDATES+=("$path")
          done <<< "${{ steps.candidates.outputs.files }}"

          REPORTS=()
          SEEN_KEYS=()
          for path in "${CANDIDATES[@]}"; do
            CHECK_OUT="$(python scripts/publish_website_updates.py --check "$path" 2>&1)" && CHECK_OK=1 || CHECK_OK=0
            echo "$CHECK_OUT"

            if [[ "$CHECK_OK" -ne 1 ]]; then
              if [[ "$STRICT" == "true" ]]; then
                echo "Strict mode: refusing to continue with invalid report $path" >&2
                exit 1
              fi
              echo "Skipping invalid/unstructured report: $path"
              continue
            fi

            # OK line looks like: OK path -> MONTH YEAR
            KEY="$(echo "$CHECK_OUT" | sed -n 's/^OK .* -> //p' | tail -n1)"
            if [[ -z "$KEY" ]]; then
              echo "Could not parse validation output for $path" >&2
              exit 1
            fi
            for seen in "${SEEN_KEYS[@]:-}"; do
              if [[ "$seen" == "$KEY" ]]; then
                echo "Duplicate report for $KEY (path: $path)" >&2
                exit 1
              fi
            done
            SEEN_KEYS+=("$KEY")
            REPORTS+=("$path")
          done

          if [[ ${#REPORTS[@]} -eq 0 ]]; then
            echo "No valid structured monthly reports to publish."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "found=true"
            echo "files<<EOF"
            printf '%s\n' "${REPORTS[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Publishing reports:"
          printf '  - %s\n' "${REPORTS[@]}"

      - name: Check out open-elements-website (upstream)
        if: steps.reports.outputs.found == 'true'
        uses: actions/checkout@v4
        with:
          # Read from upstream; push goes to the fork (origin) below.
          repository: OpenElements/open-elements-website
          path: website

      - name: Merge updates into website JSON
        if: steps.reports.outputs.found == 'true'
        id: merge
        env:
          TRANSLATION_API_URL: ${{ vars.TRANSLATION_API_URL }}
          TRANSLATION_API_KEY: ${{ secrets.TRANSLATION_API_KEY }}
          TRANSLATION_MODEL: ${{ vars.TRANSLATION_MODEL }}
        run: |
          set -euo pipefail

          if [[ -z "${TRANSLATION_API_KEY:-}" ]]; then
            echo "Missing secret TRANSLATION_API_KEY (Mittwald AI Hosting key)." >&2
            exit 1
          fi

          export TRANSLATION_API_URL="${TRANSLATION_API_URL:-https://llm.aihosting.mittwald.de/v1}"
          export TRANSLATION_MODEL="${TRANSLATION_MODEL:-gpt-oss-120b}"

          REPORTS=()
          while IFS= read -r path; do
            [[ -n "$path" ]] && REPORTS+=("$path")
          done <<< "${{ steps.reports.outputs.files }}"

          OUTPUT="$(python scripts/publish_website_updates.py "${REPORTS[@]}" --website-repo website)"
          echo "$OUTPUT"
          MONTHS="$(echo "$OUTPUT" | sed -n 's/^MONTHS=//p' | tail -n1)"
          echo "months=$MONTHS" >> "$GITHUB_OUTPUT"

          SLUG="$(printf '%s\n' "${REPORTS[@]}" \
            | sed -E 's|src/docs/reports/||; s|/index\.md||' \
            | paste -sd '-' - \
            | tr -cs '[:alnum:]-' '-' \
            | sed -E 's/^-+//; s/-+$//')"
          echo "branch=chore/maven-updates-${SLUG}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub App token
        if: steps.reports.outputs.found == 'true'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.WEBSITE_APP_ID }}
          private-key: ${{ secrets.WEBSITE_APP_PRIVATE_KEY }}
          owner: Ndacyayisenga-droid
          repositories: open-elements-website

      - name: Create pull request on website
        if: steps.reports.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MONTHS: ${{ steps.merge.outputs.months }}
          BRANCH: ${{ steps.merge.outputs.branch }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WEBSITE_UPSTREAM: OpenElements/open-elements-website
          WEBSITE_ORIGIN: Ndacyayisenga-droid/open-elements-website
        working-directory: website
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "Missing GitHub App token (check WEBSITE_APP_ID / WEBSITE_APP_PRIVATE_KEY and app install on ${WEBSITE_ORIGIN})." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # actions/checkout injects GITHUB_TOKEN via http.extraheader, which
          # overrides URL credentials and would push as github-actions[bot].
          git config --local --unset-all http.https://github.com/.extraheader || true

          # Push to the fork (origin); keep OpenElements as upstream for PRs.
          git remote rename origin upstream
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${WEBSITE_ORIGIN}.git"

          if git diff --quiet -- src/data/en/updates-maven.json src/data/de/updates-maven.json; then
            echo "Website JSON already up to date for: $MONTHS"
            exit 0
          fi

          git checkout -B "$BRANCH"
          git add src/data/en/updates-maven.json src/data/de/updates-maven.json
          git commit -m "chore: publish Maven monthly updates ($MONTHS)"
          git push -u origin "$BRANCH" --force

          HEAD_REF="Ndacyayisenga-droid:${BRANCH}"
          EXISTING_PR="$(gh pr list --repo "$WEBSITE_UPSTREAM" --head "$HEAD_REF" --json number --jq '.[0].number // empty')"
          BODY="$(cat <<EOF
          ## Summary
          - Publish Maven monthly updates for **${MONTHS}** to \`/updates/maven\`
          - Generated from English-only structured reports in \`${SOURCE_REPO}\`
          - German text is a **Mittwald AI draft** created during automation

          ## Review focus
          - [ ] German copy reviewed by a native speaker or someone who understands German
          - [ ] Preview EN and DE entries for ${MONTHS} on \`/updates/maven\`
          - [ ] Confirm types, links, excerpts, and contributors look correct

          ## Source
          - Commit: \`${SOURCE_SHA}\`
          - Workflow run: ${SOURCE_RUN}
          EOF
          )"

          if [[ -n "$EXISTING_PR" ]]; then
            echo "Updated existing PR #$EXISTING_PR on ${WEBSITE_UPSTREAM}"
            gh pr edit "$EXISTING_PR" --repo "$WEBSITE_UPSTREAM" --body "$BODY"
            gh pr comment "$EXISTING_PR" --repo "$WEBSITE_UPSTREAM" --body "Refreshed from \`${SOURCE_REPO}@${SOURCE_SHA}\`. Run: ${SOURCE_RUN}"
            exit 0
          fi

          gh pr create \
            --repo "$WEBSITE_UPSTREAM" \
            --base main \
            --head "$HEAD_REF" \
            --title "chore: publish Maven monthly updates ($MONTHS)" \
            --body "$BODY"
